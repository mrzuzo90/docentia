<svg viewBox="0 0 380 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="neuralGrad" x1="180" y1="230" x2="180" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <radialGradient id="pedestalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0" />
    </radialGradient>

  </defs>
  <ellipse cx="180" cy="454" rx="80" ry="6" fill="#0c192c" fill-opacity="0.05" />
  <g id="owl">
    
    <!-- EAR TUFTS -->
    <line x1="145" y1="95" x2="69" y2="43" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" />
    <line x1="215" y1="95" x2="291" y2="43" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" />

    <!-- OUTER WING FLANKS -->
    <path d="M 70 170 L 70 375 L 85 365" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 290 170 L 290 375 L 275 365" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- LOWER BODY TAPER -->
    <path d="M 85 365 C 95 395, 135 426, 180 426 C 225 426, 265 395, 275 365"
          stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" fill="none" />

    <!-- WINGS INNER ARCS -->
    <path d="M 86 234 C 95 270, 115 320, 85 365" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <!-- Right wing inner arc (cyan accent from reference) -->
    <path d="M 274 234 C 265 270, 245 320, 275 365" stroke="url(#neuralGrad)" stroke-width="4.2" stroke-linecap="round" fill="none" />

    <!-- HEAD CIRCLE -->
    <circle cx="180" cy="156" r="111" stroke="#0c192c" stroke-width="4.2" fill="none" />

    <!-- HEART-SHAPED FACIAL DISC -->
    <path d="M 180 160 C 160 85, 116 85, 92 118 C 72 142, 69 170, 70 190"
          stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" fill="none" />
    <path d="M 180 160 C 200 85, 244 85, 268 118 C 288 142, 291 170, 290 190"
          stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" fill="none" />

    <!-- CHIN / NECK LINE BELOW BEAK -->
    <path d="M 70 190 C 70 236, 120 248, 180 248 C 240 248, 290 236, 290 190"
          stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" fill="none" />

    
    <!-- Concentric Geometric Eyes -->
    <circle cx="124" cy="144" r="28" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="124" cy="144" r="13" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="236" cy="144" r="28" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="236" cy="144" r="13" stroke="#0c192c" stroke-width="4.2" fill="none" />
    

    <!-- BEAK (Inverted triangle touching heart notch at y=160 down to y=221) -->
    <polygon points="156,160 204,160 180,221" stroke="#0c192c" stroke-width="4.2" stroke-linejoin="round" fill="none" />

    
    <!-- CENTRAL CHEST SHIELD (CYAN ACCENT) -->
    <path d="M 86 234 C 124 256, 236 256, 274 234"
          stroke="url(#neuralGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 86 234 C 132 255, 146 348, 180 408"
          stroke="url(#neuralGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 274 234 C 228 255, 214 348, 180 408"
          stroke="url(#neuralGrad)" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- CHEST ISOMETRIC NEURAL NETWORK -->
    <g id="chest-grid">
      <!-- Vertical Lines -->
      <line x1="180" y1="256" x2="180" y2="408" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="153" y1="270" x2="153" y2="385" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="207" y1="270" x2="207" y2="385" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="126" y1="285" x2="126" y2="330" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="234" y1="285" x2="234" y2="330" stroke="url(#neuralGrad)" stroke-width="2" />

      <!-- Horizontal Interconnects -->
      <line x1="153" y1="284" x2="207" y2="284" stroke="url(#neuralGrad)" stroke-width="1.8" />
      <line x1="126" y1="322" x2="234" y2="322" stroke="url(#neuralGrad)" stroke-width="1.8" />
      <line x1="140" y1="358" x2="220" y2="358" stroke="url(#neuralGrad)" stroke-width="1.8" />

      <!-- Diagonal Lattice Lines -->
      <line x1="180" y1="256" x2="207" y2="284" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="207" y1="284" x2="234" y2="322" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="153" y1="284" x2="180" y2="322" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="180" y1="322" x2="207" y2="358" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="126" y1="322" x2="153" y2="358" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="153" y1="358" x2="180" y2="394" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="180" y1="394" x2="180" y2="408" stroke="url(#neuralGrad)" stroke-width="2" />

      <line x1="180" y1="256" x2="153" y2="284" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="153" y1="284" x2="126" y2="322" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="207" y1="284" x2="180" y2="322" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="180" y1="322" x2="153" y2="358" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="234" y1="322" x2="207" y2="358" stroke="url(#neuralGrad)" stroke-width="2" />
      <line x1="207" y1="358" x2="180" y2="394" stroke="url(#neuralGrad)" stroke-width="2" />

      <!-- Active Neural Dots at Intersections -->
      <circle cx="180" cy="256" r="3.2" fill="#38bdf8" />
      <circle cx="180" cy="284" r="3.2" fill="#38bdf8" />
      <circle cx="180" cy="322" r="3.4" fill="#06b6d4" />
      <circle cx="180" cy="358" r="3.4" fill="#06b6d4" />
      <circle cx="180" cy="394" r="3.2" fill="#0284c7" />

      <circle cx="153" cy="284" r="3.2" fill="#38bdf8" />
      <circle cx="153" cy="322" r="3.4" fill="#06b6d4" />
      <circle cx="153" cy="358" r="3.2" fill="#0284c7" />

      <circle cx="207" cy="284" r="3.2" fill="#38bdf8" />
      <circle cx="207" cy="322" r="3.4" fill="#06b6d4" />
      <circle cx="207" cy="358" r="3.2" fill="#0284c7" />

      <circle cx="126" cy="322" r="2.8" fill="#38bdf8" />
      <circle cx="234" cy="322" r="2.8" fill="#38bdf8" />
    </g>
    
    
    <!-- Floating Rubric Tablet -->
    <g transform="translate(10, 0)">
      <rect x="236" y="215" width="112" height="150" rx="14" fill="#ffffff" stroke="#d6d6d6" stroke-width="2" />
      <path d="M 236 229 C 236 221, 242 215, 250 215 L 336 215 C 344 215, 350 221, 350 229 L 350 240 L 236 240 Z" fill="#f5f5f7" />
      <circle cx="248" cy="228" r="3" fill="#0071e3" />
      <line x1="258" y1="228" x2="305" y2="228" stroke="#707070" stroke-width="2" stroke-linecap="round" />

      <!-- Rubric Criteria Lines -->
      <line x1="248" y1="256" x2="338" y2="256" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" />
      <line x1="248" y1="270" x2="320" y2="270" stroke="#d6d6d6" stroke-width="2" stroke-linecap="round" />
      <line x1="248" y1="284" x2="332" y2="284" stroke="#d6d6d6" stroke-width="2" stroke-linecap="round" />
      <line x1="248" y1="298" x2="310" y2="298" stroke="#d6d6d6" stroke-width="2" stroke-linecap="round" />

      <!-- Official Verified 10,00 Stamp -->
      <circle cx="316" cy="336" r="15" fill="#f59e0b" />
      <path d="M 310 336 L 314 340 L 323 331" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 312 349 L 308 360 L 316 356 L 324 360 L 320 349 Z" fill="#d97706" />
    </g>


    <!-- FEET & GROUND BASE -->
    <line x1="122" y1="444" x2="238" y2="444" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" />
    <path d="M 122 444 C 122 418, 174 418, 174 444" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <path d="M 186 444 C 186 418, 238 418, 238 444" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <line x1="180" y1="426" x2="180" y2="444" stroke="#0c192c" stroke-width="4.2" />
    
  </g>
</svg>