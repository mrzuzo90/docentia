<svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes scanLaser {
      0%, 100% { transform: translateY(-34px); }
      50% { transform: translateY(42px); }
    }
    @keyframes lensMove {
      0%, 100% { transform: translate(0px, -6px) rotate(-4deg); }
      50% { transform: translate(8px, 10px) rotate(4deg); }
    }
    .laser-line { animation: scanLaser 2.6s ease-in-out infinite; }
    .lens-group { animation: lensMove 2.6s ease-in-out infinite; transform-origin: 184px 148px; }
  </style>

  <!-- Handwritten Exam Sheet -->
  <rect x="52" y="42" width="152" height="192" rx="18" fill="#ffffff" stroke="#000437" stroke-width="4" />
  <rect x="76" y="74" width="96" height="10" rx="5" fill="#d7ffb8" />
  <rect x="76" y="98" width="76" height="10" rx="5" fill="#afafaf" />
  <rect x="76" y="138" width="104" height="10" rx="5" fill="#afafaf" />
  <rect x="76" y="162" width="68" height="10" rx="5" fill="#ff9600" />
  <circle cx="90" cy="198" r="12" fill="#58cc02" stroke="#000437" stroke-width="3" />
  <path d="M85 198L88.5 201.5L96 194" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

  <!-- Animated Laser Line -->
  <g class="laser-line">
    <line x1="40" y1="126" x2="218" y2="126" stroke="#58cc02" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Inspector Owl Mascot -->
  <rect x="216" y="82" width="118" height="148" rx="58" fill="#58cc02" stroke="#000437" stroke-width="4" />
  <circle cx="254" cy="130" r="18" fill="#ffffff" stroke="#000437" stroke-width="3.5" />
  <circle cx="294" cy="130" r="18" fill="#ffffff" stroke="#000437" stroke-width="3.5" />
  <circle cx="250" cy="130" r="8" fill="#000437" />
  <circle cx="290" cy="130" r="8" fill="#000437" />
  <polygon points="266,144 282,144 274,156" fill="#ffc800" stroke="#000437" stroke-width="3" />

  <!-- Animated Magnifying Glass -->
  <g class="lens-group">
    <circle cx="176" cy="144" r="38" fill="#1cb0f6" fill-opacity="0.24" stroke="#000437" stroke-width="5" />
    <path d="M156 126C162 118 172 116 182 120" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <line x1="204" y1="170" x2="232" y2="198" stroke="#ff9600" stroke-width="9" stroke-linecap="round" />
    <line x1="204" y1="170" x2="232" y2="198" stroke="#000437" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
