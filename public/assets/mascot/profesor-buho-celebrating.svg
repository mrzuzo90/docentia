<svg viewBox="0 0 380 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes duoJump {
      0%, 100% { transform: translateY(0px) scale(1.03, 0.97); }
      45% { transform: translateY(-18px) scale(0.97, 1.04); }
      55% { transform: translateY(-20px) scale(1, 1); }
    }
    @keyframes duoShadowJump {
      0%, 100% { transform: scaleX(1.06); opacity: 0.2; }
      50% { transform: scaleX(0.68); opacity: 0.08; }
    }
    @keyframes confettiSpin {
      0%, 100% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-10px) rotate(24deg) scale(1.12); }
    }
    .jump-body { animation: duoJump 1.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 190px 230px; }
    .jump-shadow { animation: duoShadowJump 1.6s ease-in-out infinite; transform-origin: 190px 258px; }
    .confetti-a { animation: confettiSpin 2.1s ease-in-out infinite; transform-origin: 68px 64px; }
    .confetti-b { animation: confettiSpin 2.4s ease-in-out infinite 0.4s; transform-origin: 316px 58px; }
  </style>

  <!-- Shadow -->
  <ellipse class="jump-shadow" cx="190" cy="258" rx="68" ry="11" fill="#000437" fill-opacity="0.16" />

  <!-- Floating Confetti -->
  <g class="confetti-a">
    <circle cx="68" cy="64" r="11" fill="#ff86d0" stroke="#000437" stroke-width="3.5" />
    <rect x="44" y="132" width="18" height="18" rx="5" transform="rotate(-18 44 132)" fill="#1cb0f6" stroke="#000437" stroke-width="3.5" />
  </g>
  <g class="confetti-b">
    <circle cx="316" cy="58" r="13" fill="#ffc800" stroke="#000437" stroke-width="3.5" />
    <rect x="322" y="144" width="20" height="20" rx="6" transform="rotate(22 322 144)" fill="#ce82ff" stroke="#000437" stroke-width="3.5" />
  </g>

  <!-- Jumping Mascot + Trophy -->
  <g class="jump-body">
    <!-- Feet tucked in jump -->
    <rect x="150" y="226" width="30" height="15" rx="7.5" transform="rotate(-12 150 226)" fill="#ff9600" stroke="#000437" stroke-width="4" />
    <rect x="204" y="226" width="30" height="15" rx="7.5" transform="rotate(12 204 226)" fill="#ff9600" stroke="#000437" stroke-width="4" />

    <!-- Owl Body -->
    <rect x="122" y="64" width="136" height="170" rx="66" fill="#58cc02" stroke="#000437" stroke-width="4" />

    <!-- Excited Raised Wings -->
    <path d="M126 124C90 92 78 122 104 152L124 162" fill="#58cc02" stroke="#000437" stroke-width="4" stroke-linecap="round" />
    <path d="M254 124C290 92 302 122 276 152L256 162" fill="#58cc02" stroke="#000437" stroke-width="4" stroke-linecap="round" />

    <!-- Belly -->
    <rect x="148" y="156" width="84" height="62" rx="40" fill="#a5ed6e" stroke="#000437" stroke-width="3.5" />

    <!-- Happy Arc Eyes -->
    <circle cx="166" cy="116" r="22" fill="#ffffff" stroke="#000437" stroke-width="4" />
    <circle cx="214" cy="116" r="22" fill="#ffffff" stroke="#000437" stroke-width="4" />
    <path d="M156 116C160 106 172 106 176 116" stroke="#000437" stroke-width="4.5" stroke-linecap="round" />
    <path d="M204 116C208 106 220 106 224 116" stroke="#000437" stroke-width="4.5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <ellipse cx="148" cy="134" rx="9" ry="5" fill="#ff86d0" />
    <ellipse cx="232" cy="134" rx="9" ry="5" fill="#ff86d0" />

    <!-- Open Smiling Beak -->
    <path d="M178 130H202L190 150L178 130Z" fill="#ffc800" stroke="#000437" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Gold 10/10 Badge Held Overhead -->
    <circle cx="288" cy="96" r="28" fill="#ffc800" stroke="#000437" stroke-width="4" />
    <text x="288" y="104" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="22" fill="#000437">10</text>
  </g>
</svg>
