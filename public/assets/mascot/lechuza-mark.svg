    <line x1="120" y1="195" x2="120" y2="218" stroke="url(#markCyanGrad)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="120" cy="218" r="3.4" fill="#38bdf8" />
    <circle cx="98" cy="208" r="2.8" fill="#06b6d4" />
    <circle cx="142" cy="208" r="2.8" fill="#06b6d4" />
