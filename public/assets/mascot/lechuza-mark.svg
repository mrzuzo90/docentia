    <line x1="95" y1="78" x2="38" y2="28" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" />
    <line x1="145" y1="78" x2="202" y2="28" stroke="#0c192c" stroke-width="4.2" stroke-linecap="round" />

    <!-- Head Circle -->
    <circle cx="120" cy="115" r="88" stroke="#0c192c" stroke-width="4.2" fill="none" />

