    <circle cx="75" cy="112" r="23" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="75" cy="112" r="10.5" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="165" cy="112" r="23" stroke="#0c192c" stroke-width="4.2" fill="none" />
    <circle cx="165" cy="112" r="10.5" stroke="#0c192c" stroke-width="4.2" fill="none" />

    <!-- Beak -->
